name: Visual Regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  dev_vs_staging:
    name: Dev vs Staging Comparison
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: write
    env:
      REGRESSION_COMPARISON: dev-vs-staging
      DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
      DEV_BASIC_AUTH_USER: ${{ secrets.DEV_BASIC_AUTH_USER }}
      DEV_BASIC_AUTH_PASS: ${{ secrets.DEV_BASIC_AUTH_PASS }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Ensure Playwright browsers
        run: npx playwright install --with-deps

      - name: Project setup
        run: npm run setup

      - name: Validate environment configuration
        run: npm run validate:env-config

      - name: Run regression comparison
        run: node src/ci/regressionRunner.js

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-dev-vs-staging
          path: |
            screenshots/regression/dev-vs-staging/**
            screenshots/regression/diff/dev-vs-staging/**
          if-no-files-found: warn

  staging_vs_production:
    name: Staging vs Production Comparison
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: write
    env:
      REGRESSION_COMPARISON: staging-vs-production
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Ensure Playwright browsers
        run: npx playwright install --with-deps

      - name: Project setup
        run: npm run setup

      - name: Validate environment configuration
        run: npm run validate:env-config

      - name: Run regression comparison
        run: node src/ci/regressionRunner.js

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-staging-vs-production
          path: |
            screenshots/regression/staging-vs-production/**
            screenshots/regression/diff/staging-vs-production/**
          if-no-files-found: warn
